scalar UUID
scalar Timestamp
scalar JSON

type Query {
    asset(id: UUID!): Asset!
    issue(id: UUID!): Issue!
    assetsList(filter: JSON, order: [JSON!], limit: Int, page: Int): [Asset!]!
    issuesList(filter: JSON, order: [JSON!], limit: Int, page: Int, targetEnvironment: String): [Issue!]!
    issuesAggregate(filter: JSON, targetEnvironment: String): AggregateResponse!
    searchRecords(input: SearchRecordsInput!): [JSON!]!
}

type Mutation {
    identifyAccount(input: IdentifyAccountInput!): Account!
    trackEvent(input: TrackEventInput!): TrackEventResponse!
    createIssue(input: CreateIssueInput!): Issue!
    upsertIssue(input: UpsertIssueInput!): Issue!
    createBroadcast(input: CreateBroadcastInput!): Broadcast!
    startInAppChatConversation(input: StartInAppChatConversationInput!): Conversation!
}

type Account {
    id: UUID!
    environmentId: UUID!
    email: String
    phone: String
    fullName: String
    name: String
    firstName: String
    lastName: String
    avatar: String
    timeZone: String
    uid: String
    anonymousUid: String
    createdAt: Timestamp!
    updatedAt: Timestamp!
}

type Asset {
    id: UUID!
    workspaceId: UUID!
    resourceId: UUID
    attributeId: UUID
    storageProviderId: UUID
    uploaderId: UUID
    data: JSON!
    uploadStatus: String!
    processingStatus: String!
    createdAt: Timestamp!
    updatedAt: Timestamp!
    name: String
    size: Int
    mimeType: String
    uploadStatusReason: String
    processingStatusReason: String
    url: String
    staticVideoUrls: JSON
    staticAudioUrl: String
}

type Issue {
    id: UUID!
    workspaceId: UUID!
    issueStatusId: UUID!
    issueStatus: IssueStatus!
    createdById: UUID!
    environmentId: UUID!
    requestedById: UUID
    spaceId: UUID
    parentId: UUID
    assigneeId: UUID
    groupId: UUID
    priority: IssuePriority
    title: String!
    description: String
    position: Int
    properties: JSON!
    createdAt: Timestamp!
    updatedAt: Timestamp!
    issueTypeId: UUID!
    dueAt: Timestamp
    number: Int!
    idempotencyKey: String
}

type IssueStatus {
    id: UUID!
    workspaceId: UUID!
    issueTypeId: UUID!
    kind: IssueStatusKind!
    name: String!
    identifier: String!
    color: String
    position: Int!
    isDefault: Boolean!
    createdAt: Timestamp!
    updatedAt: Timestamp!
}

type Conversation {
    id: UUID!
    workspaceId: UUID!
    environmentId: UUID!
    kind: ConversationKind!
    channel: ConversationChannel!
    subChannel: ConversationSubChannel
    name: String
    idempotencyKey: String
    lastMessageAt: Timestamp
    isTest: Boolean!
    createdAt: Timestamp!
    updatedAt: Timestamp!
}

type TrackEventResponse {
    success: Boolean!
}

type AggregateResponse {
    count: Int
}

type Broadcast {
    id: UUID!
    templateSubkind: TemplateSubkind!
    environmentId: UUID!
    campaignId: UUID
    integrationId: UUID
    templateId: UUID
    content: JSON
    name: String
    data: JSON
    status: BroadcastStatus!
    failureReason: String
    queuedMessagesCount: Int
    sentMessagesCount: Int
    deliveredMessagesCount: Int
    failedMessagesCount: Int
    openedMessagesCount: Int
    clickedMessagesCount: Int
    scheduledAt: Timestamp
    custom: JSON
    createdAt: Timestamp!
    updatedAt: Timestamp!
}

input CreateIssueInput {
    issueType: String
    issueStatus: String
    space: String
    parent: String
    assigneeId: UUID
    priority: IssuePriority
    title: String!
    description: String
    position: Int
    properties: JSON!
    labels: [String!]
    dueAt: Timestamp
    idempotencyKey: String
    group: String
    requestedBy: JSON
}

input UpsertIssueInput {
    idempotencyKey: String
    issueType: String
    issueStatus: String
    space: String
    parent: String
    assigneeId: UUID
    group: String
    priority: IssuePriority
    title: String!
    description: String
    position: Int
    properties: JSON!
    labels: [String!]
    dueAt: Timestamp
    requestedBy: JSON
}

# Creates (or idempotently re-finds) an In-App Chat conversation on behalf of a visitor.
#
# SERVER-ONLY: the DashX operation rejects identity-token callers, so this is authenticated
# with the workspace public/private key pair — the same credentials this SDK already sends.
# A browser must never call it; browsers participate in a conversation they were given.
#
# `identityId` and `accountUid` are BOTH required and are different things:
#   identityId  — the workspace-side Chat Identity (which chat surface / routing).
#   accountUid  — the visitor's own account `uid` in the target environment (who owns it).
# Supplying one in place of the other resolves the wrong owner or fails outright.
input StartInAppChatConversationInput {
    identityId: UUID!
    accountUid: String!
    clientIdempotencyKey: String!
    content: JSON
    clientMessageId: String
    data: JSON
    issueProperties: JSON
}

input IdentifyAccountInput {
    uid: String
    anonymousUid: String
    email: String
    phone: String
    name: String
    firstName: String
    lastName: String
    systemContext: JSON
}

input SearchRecordsInput {
    resource: String!
    filter: JSON
    order: [JSON!]
    limit: Int
    page: Int
    preview: Boolean
    language: String
    fields: [JSON!]
    include: [JSON!]
    exclude: [JSON!]
}

input TrackEventInput {
    event: String!
    accountUid: String
    accountAnonymousUid: String
    data: JSON
    timestamp: Timestamp
    systemContext: JSON
}

input CreateBroadcastInput {
    templateSubkind: TemplateSubkind!
    integrationId: UUID
    templateId: UUID
    templateIdentifier: String
    content: JSON
    name: String
    data: JSON
    isDraft: Boolean
    scheduledAt: Timestamp
    targetEnvironment: String
    custom: JSON
    campaignId: UUID
}

enum AssetProcessingStatus {
    PENDING
    COMPLETED
    FAILED
}

enum AssetUploadStatus {
    PENDING
    UPLOADED
    FAILED
    CANCELED
    TIMED_OUT
}

enum ConversationKind {
    DIRECT
    NAMED_GROUP
    ANONYMOUS_GROUP
}

enum ConversationChannel {
    EMAIL
    SMS
    PUSH
    CHAT
    IN_APP
}

enum ConversationSubChannel {
    IOS
    ANDROID
    WEB
    WHATSAPP
    SIGNAL
    TELEGRAM
    SLACK
    MICROSOFT_TEAMS
    DASHX
}

enum IssuePriority {
    NONE
    LOW
    MEDIUM
    HIGH
    URGENT
}

enum IssueStatusKind {
    BACKLOG
    NOT_STARTED
    STARTED
    COMPLETED
    CANCELED
}

enum TemplateSubkind {
    SCREEN
    OVERLAY
    EMAIL
    SMS
    PUSH
    WHATSAPP
    IN_APP
}

enum BroadcastStatus {
    DRAFT
    SCHEDULED
    PENDING
    QUEUED
    PROCESSED
    FAILED
}
