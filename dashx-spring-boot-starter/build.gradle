plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.36.0'
}

def version = libs.versions.dashx.get()
def group = libs.versions.group.get()
def artifactId = "dashx-spring-boot-starter"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':dashx')

    compileOnly 'org.springframework.boot:spring-boot-autoconfigure:3.4.1'
    compileOnly 'org.springframework.boot:spring-boot-starter:3.4.1'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Signing is required by Maven Central but must not be required to install locally.
// CI supplies the key as ORG_GRADLE_PROJECT_signingInMemoryKey (see .github/workflows/publish.yml),
// which Gradle exposes as the `signingInMemoryKey` project property; without it,
// `signAllPublications()` would still attach `.asc` artifacts to the publication and every
// `publishToMavenLocal` would fail validation on the missing signature files (skipping the sign
// task alone does not help — the artifacts remain declared).
def isSigningConfigured = providers.gradleProperty('signingInMemoryKey').isPresent()

mavenPublishing {
    coordinates(group, artifactId, version)

    publishToMavenCentral(true)

    if (isSigningConfigured) {
        signAllPublications()
    }

    pom {
        name = 'DashX Spring Boot Starter'
        description = 'DashX Starter for Spring Boot Applications'
        url = 'https://github.com/dashxhq/dashx-java'

        licenses {
            license {
                name = 'MIT License'
                url = 'https://github.com/dashxhq/dashx-java/blob/main/LICENSE'
            }
        }

        developers {
            developer {
                id = 'gulshan.dashx'
                name = 'Gulshan Dhingra'
            }
        }

        scm {
            connection = 'scm:git:github.com/dashxhq/dashx-java.git'
            developerConnection = 'scm:git:ssh://github.com/dashxhq/dashx-java.git'
            url = 'https://github.com/dashxhq/dashx-java'
        }
    }
}
